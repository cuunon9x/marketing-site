# Ticket FE-13 — build Astro (SSG) + deploy GitHub Pages. Push để publish thay đổi code ngay; cron hàng
# đêm để build lại lấy ranking/club mới mà KHÔNG cần commit nào (dữ liệu đến từ Backend API lúc build-time,
# xem decisions-log.md mục "Ticket FE-13").
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 03:00 UTC (~10:00 sáng giờ Việt Nam) mỗi ngày.
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          # Đặt biến này ở GitHub repo Settings → Secrets and variables → Actions → Variables (KHÔNG phải
          # Secrets — đây là URL public của Backend API, không phải giá trị nhạy cảm, nhưng vẫn nên cấu
          # hình qua UI thay vì hard-code ở đây để đổi được không cần sửa code, cùng nguyên tắc rotate secret
          # ở security-checklist skill).
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          # Ticket FE-30 — biến riêng cho client-side bundle (LeadForm.astro, tiền tố PUBLIC_ được Astro/Vite
          # inline lúc build). Cũng là repo Variable (không phải Secret) vì là URL public; giữ tách biệt với
          # API_BASE_URL (chỉ dùng server/build-time trong src/lib/api.ts).
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
